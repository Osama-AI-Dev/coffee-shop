<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="Stylesheet" href="style.css">

</head>
<body>
    <header class="navbar">
        <div class="logo"> <img src="logo.jpg" width="100px"> </div>
        <a href="index.html" > Home </a>
        <a href="menu.html"> Menu</a>
        <a href="about.html"> About  </a>
        <a href="contact.html"> Contact </a>
    </header>

    <section id="contact" class="contact-section">
  <h2 class="section-title">تواصل معنا وسجل زيارتك</h2>

  <div class="contact-container">
    
    <!-- قسم معلومات التواصل -->
    <div class="contact-info">
      <h3>معلومات الفرع</h3>
      
      <div class="info-item">
        <strong>العنوان:</strong>
        <p> *********************</p>
      </div>

      <div class="info-item">
        <strong>أوقات العمل:</strong>
        <p>يومياً من 8 صباحاً حتى 12 منتصف الليل</p>
      </div>

      <div class="info-item">
        <strong>رقم الهاتف:</strong>
        <p>+20 100 000 0000</p>
      </div>
    </div>

    <!-- نموذج التواصل -->
    <form class="contact-form">
      <h3>أرسل لنا رسالة</h3>
      
      <div class="form-group">
        <label for="name">الاسم</label>
        <input type="text" id="name" placeholder="أدخل اسمك بالكامل" required>
      </div>

      <div class="form-group">
        <label for="contact-input">البريد الإلكتروني أو الهاتف</label>
        <input type="text" id="contact-input" placeholder="example@mail.com / 010xxxxxxx" required>
      </div>

      <button type="submit" class="submit-btn">إرسال</button>
    </form>

  </div>
</section>



    
</body>
</html>
